<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cofre Financeiro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: painel lateral fixo + área de trabalho; login em tela cheia. Tema escuro (vermelho sangue e preto) é o padrão; claro usa branco e ciano. */
:root{
  --bg:#0a0607;--bg2:#100a0c;--surface:#160d10;--surface2:#1f1216;--line:#32191e;
  --fg:#f4ecec;--muted:#ab9a9e;--accent:#c1121f;--accent-fg:#ff4d57;--accent-soft:rgba(193,18,31,.16);--on-accent:#fff;
  --pos:#3ddc97;--neg:#ff5a5f;--warn:#ffb020;--info:#7cc4ff;
  --c1:#e5383b;--c2:#f4a6a6;--c3:#9a8c98;--c4:#ffb703;--c5:#4cc9f0;--c6:#80b918;--grid:#2a161b;
  --shadow:0 12px 40px rgba(0,0,0,.55);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#ffffff;--bg2:#effafc;--surface:#ffffff;--surface2:#e6f7fb;--line:#c8e5ed;
  --fg:#082630;--muted:#486873;--accent:#0a7f9b;--accent-fg:#0a7f9b;--accent-soft:rgba(0,194,224,.14);--on-accent:#fff;
  --pos:#0f8a55;--neg:#d6293a;--warn:#b86e00;--info:#0a6fb5;
  --c1:#0a7f9b;--c2:#00c2e0;--c3:#082630;--c4:#e08a00;--c5:#6d4bd1;--c6:#18a05a;--grid:#d9edf3;
  --shadow:0 10px 30px rgba(8,38,48,.12);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#ffffff;--bg2:#effafc;--surface:#ffffff;--surface2:#e6f7fb;--line:#c8e5ed;
  --fg:#082630;--muted:#486873;--accent:#0a7f9b;--accent-fg:#0a7f9b;--accent-soft:rgba(0,194,224,.14);--on-accent:#fff;
  --pos:#0f8a55;--neg:#d6293a;--warn:#b86e00;--info:#0a6fb5;
  --c1:#0a7f9b;--c2:#00c2e0;--c3:#082630;--c4:#e08a00;--c5:#6d4bd1;--c6:#18a05a;--grid:#d9edf3;
  --shadow:0 10px 30px rgba(8,38,48,.12);color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0a0607;--bg2:#100a0c;--surface:#160d10;--surface2:#1f1216;--line:#32191e;
  --fg:#f4ecec;--muted:#ab9a9e;--accent:#c1121f;--accent-fg:#ff4d57;--accent-soft:rgba(193,18,31,.16);--on-accent:#fff;
  --pos:#3ddc97;--neg:#ff5a5f;--warn:#ffb020;--info:#7cc4ff;
  --c1:#e5383b;--c2:#f4a6a6;--c3:#9a8c98;--c4:#ffb703;--c5:#4cc9f0;--c6:#80b918;--grid:#2a161b;
  --shadow:0 12px 40px rgba(0,0,0,.55);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(1.5rem,3vw,2rem);font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px}
.label{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* login */
.login{position:relative;min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr;gap:0;align-items:stretch;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.login-brand{position:relative;padding:clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;background:
  radial-gradient(120% 90% at 0% 0%,var(--accent-soft),transparent 60%),var(--bg2);border-right:1px solid var(--line);overflow:hidden}
.login-brand h1{font-size:clamp(2.2rem,5vw,3.8rem);line-height:1;max-width:11ch}
.login-brand h1 em{font-style:normal;color:var(--accent-fg)}
.vault{width:min(260px,60%);aspect-ratio:1;opacity:.9}
.login-card{display:flex;align-items:center;justify-content:center;padding:clamp(20px,4vw,56px)}
.login-card form{width:min(420px,100%);display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(20px,3vw,32px);box-shadow:var(--shadow)}
.login-card input[type=text],.login-card input[type=password]{padding:12px 14px;font-size:1rem}
.login-theme{position:absolute;z-index:5;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.brandmark{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.05rem}
.brandmark i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);font-style:normal;font-size:.9rem}

/* fields */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:.78rem;color:var(--muted);font-weight:500}
.field small{color:var(--muted);font-size:.72rem}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=month],select,textarea{width:100%;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--fg);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-fg);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.check{display:flex;gap:8px;align-items:center;font-size:.85rem}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.85rem;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{border-color:var(--accent-fg)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface2)}
.btn.danger{color:var(--neg)}
.btn.sm{padding:5px 9px;font-size:.78rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.err{color:var(--neg);font-size:.82rem;min-height:1.2em}

/* shell */
.shell{display:block;min-height:100vh;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.side{position:fixed;z-index:60;left:0;top:0;bottom:0;width:min(290px,86vw);background:var(--bg2);border-right:1px solid var(--line);padding:18px 14px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;overflow-y:auto;transform:translateX(-105%);visibility:hidden;transition:transform .22s ease,visibility .22s}
.side.open{transform:none;visibility:visible;box-shadow:var(--shadow)}
.menu-scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;opacity:0;pointer-events:none;transition:opacity .22s}
.menu-scrim.show{opacity:1;pointer-events:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--muted);cursor:pointer;font-weight:500}
.nav button:hover{background:var(--surface2);color:var(--fg)}
.nav button[aria-current=page]{background:var(--accent-soft);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent-fg)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.main{min-width:0;max-width:1320px;margin-inline:auto;padding:22px clamp(16px,3vw,36px) 56px;padding-right:max(clamp(16px,3vw,36px),env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:70}
.iconbtn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);cursor:pointer;padding:0;transition:border-color .15s,transform .1s}
.iconbtn:hover{border-color:var(--accent-fg)}.iconbtn:active{transform:scale(.95)}
.iconbtn svg{width:24px;height:24px}
.hamb path{stroke:currentColor;stroke-width:2.2;stroke-linecap:round;fill:none}
.themebtn{background:radial-gradient(circle at 30% 25%,var(--surface2),var(--bg2))}
.themebtn svg{width:30px;height:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.totop{position:fixed;z-index:45;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .2s,transform .2s}
.totop.show{opacity:1;pointer-events:auto;transform:none}
.totop:hover{filter:brightness(1.12)}
.totop svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.donutwrap{display:grid;grid-template-columns:minmax(0,170px) 1fr;gap:16px;align-items:center}
.kv dd{overflow-wrap:anywhere}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 20px;margin-bottom:20px}
.page-head p{color:var(--muted);margin-top:4px;max-width:70ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.demo{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px dashed var(--accent-fg);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:.85rem}

/* cards */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card.flat{background:transparent}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi b{font-family:var(--display);font-size:clamp(1.15rem,1.8vw,1.55rem);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.kpi small{color:var(--muted);font-size:.78rem}
.kpi.hero{background:linear-gradient(160deg,var(--accent-soft),transparent 70%),var(--surface);border-color:var(--accent)}
.sec{margin-top:26px;display:flex;flex-direction:column;gap:14px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--bg2);position:sticky;top:0}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
tfoot td{font-weight:700;background:var(--bg2)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:600;border:1px solid var(--line);color:var(--muted)}
.badge.pos{color:var(--pos);border-color:currentColor}.badge.neg{color:var(--neg);border-color:currentColor}.badge.warn{color:var(--warn);border-color:currentColor}.badge.ex{color:var(--info);border-color:currentColor}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--accent-fg);border-radius:99px}
.bar i.ok{background:var(--pos)}.bar i.wr{background:var(--warn)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .tick{fill:var(--muted);font:10.5px var(--mono)}
.chart .lab{fill:var(--fg);font:600 11px var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.recs{display:flex;flex-direction:column;gap:10px}
.rec{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);border-left-width:4px}
.rec.crit{border-left-color:var(--neg)}.rec.warn{border-left-color:var(--warn)}.rec.ok{border-left-color:var(--pos)}.rec.info{border-left-color:var(--info)}
.rec .ic{grid-row:span 2;font-size:1.1rem;align-self:start;font-family:var(--mono)}
.rec p{color:var(--muted);font-size:.85rem;grid-column:2}
.rec .imp{grid-row:1;grid-column:3;text-align:right;font-family:var(--mono);font-size:.8rem}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.pill-tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);padding:4px;border-radius:10px;width:fit-content;max-width:100%}
.pill-tabs button{background:none;border:0;padding:7px 12px;border-radius:7px;color:var(--muted);cursor:pointer;font-weight:600;font-size:.82rem}
.pill-tabs button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-family:var(--mono)}
.sep{height:1px;background:var(--line);margin:10px 0}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
pre.report{white-space:pre-wrap;overflow-x:auto;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px;font:12.5px/1.6 var(--mono);margin:0}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px;width:min(560px,100%);max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:90vw}
.lock-banner{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.78rem}

@media (max-width:900px){
  .login{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .login-brand{min-height:0;border-right:0;border-bottom:1px solid var(--line);padding:20px 72px 20px 16px;gap:14px}
  .login-brand h1{font-size:1.9rem;max-width:none}
  .login-brand p{display:none}
  .login-card{padding:20px 16px}
  .vault{display:none}
  .rec{grid-template-columns:auto 1fr}
  .rec .imp{grid-column:2;grid-row:auto;text-align:left}
}
@media (max-height:640px){.login-brand{padding-block:14px}.login-brand h1{font-size:1.5rem}.login-card{padding-block:12px}.login-card form{gap:12px;padding:16px}}
@media (max-width:700px){
  .main{padding-top:16px}
  .chart svg[viewBox^="0 0 640"] .tick{font-size:17px}
  .chart svg[viewBox^="0 0 640"] .lab{font-size:18px}
  .tablewrap:not(.keep){border:0;background:transparent;overflow:visible}
  .tablewrap:not(.keep) table{min-width:0;display:block}
  .tablewrap:not(.keep) thead{display:none}
  .tablewrap:not(.keep) tbody,.tablewrap:not(.keep) tfoot{display:flex;flex-direction:column;gap:10px}
  .tablewrap:not(.keep) tfoot{margin-top:10px}
  .tablewrap:not(.keep) tr{display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 12px}
  .tablewrap:not(.keep) tfoot tr{background:var(--bg2)}
  .tablewrap:not(.keep) td{display:flex;justify-content:space-between;align-items:baseline;gap:14px;white-space:normal;text-align:right!important;padding:8px 0;border-bottom:1px solid var(--line)}
  .tablewrap:not(.keep) td:last-child{border-bottom:0}
  .tablewrap:not(.keep) td::before{content:attr(data-label);color:var(--muted);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;text-align:left;flex:none}
  .tablewrap:not(.keep) td:not([data-label])::before{content:none}
  .tablewrap:not(.keep) td[colspan]{display:block}
  .tablewrap:not(.keep) td:empty{display:none}
  .tablewrap:not(.keep) td:first-child{display:block;text-align:left!important;font-weight:600;padding-top:10px}
  .tablewrap:not(.keep) td:first-child::before{content:none}
  .page-head .actions{width:100%}
  .page-head .actions .btn{flex:1 1 auto}
  .field[style*="width:170px"]{width:100%!important}
}
@media (max-width:480px){
  .donutwrap{grid-template-columns:1fr;justify-items:center}
  .donutwrap>div{width:100%}
  .kv{grid-template-columns:1fr;gap:2px}
  .kv dd{text-align:left;margin-bottom:8px}
  .card{padding:14px}
  .modal{padding:16px}
  .pill-tabs{width:100%}.pill-tabs button{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</defs></svg>

<script>
'use strict';
/* ===== utilidades ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* ===== criptografia (PBKDF2 + AES-GCM, tudo no navegador) ===== */
const TE=new TextEncoder(),TD=new TextDecoder();
const DEF_SALT='cf-2026-cleilton-fin',DEF_VER='8hY0Jwc+JEkKWj5VLrg4wcP4UJClPxW7JG5fdhsktJE=';
const toB64=buf=>{let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
const fromB64=s=>{const bin=atob(s),b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b};
async function pbk(pass,salt,bits){const k=await crypto.subtle.importKey('raw',TE.encode(pass),'PBKDF2',false,['deriveBits']);return crypto.subtle.deriveBits({name:'PBKDF2',salt:TE.encode(salt),iterations:150000,hash:'SHA-256'},k,bits)}
const verifier=async(u,p,salt)=>toB64(await pbk(u.trim().toLowerCase()+'\u0000'+p,'v:'+salt,256));
const dataKey=async(p,salt)=>crypto.subtle.importKey('raw',await pbk(p,'k:'+salt,256),'AES-GCM',false,['encrypt','decrypt']);
async function seal(obj,key){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,TE.encode(JSON.stringify(obj)));return toB64(iv)+'.'+toB64(ct)}
async function unseal(s,key){const [a,b]=s.split('.');return JSON.parse(TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(a)},key,fromB64(b))))}
const getCred=()=>{try{const c=JSON.parse(LS.get('cf_cred')||'null');if(c&&c.salt&&c.ver)return c}catch(e){}return{salt:DEF_SALT,ver:DEF_VER}};

/* ===== cálculos tributários e de salário ===== */
const irRate=d=>d<=180?.225:d<=360?.2:d<=720?.175:.15;
const IOF=[96,93,90,86,83,80,76,73,70,66,63,60,56,53,50,46,43,40,36,33,30,26,23,20,16,13,10,6,3,0];
function inssCalc(b){const f=[[1621,.075],[2902.84,.09],[4354.27,.12],[8475.55,.14]];let r=0,prev=0;for(const[t,a]of f){if(b>prev){r+=(Math.min(b,t)-prev)*a;prev=t}}return r}
function irrfCalc(b,inss,dep,outros){
  const base=Math.max(0,b-inss-(dep||0)*189.59-(outros||0));
  const tb=[[2428.8,0,0],[2826.65,.075,182.16],[3751.05,.15,394.16],[4664.68,.225,675.49],[1e12,.275,908.73]];
  let imp=0;for(const[t,a,d]of tb){if(base<=t){imp=Math.max(0,base*a-d);break}}
  let red=0;if(b<=5000)red=imp;else if(b<=7350)red=Math.max(0,978.62-0.133145*b);
  return{base,imp,red:Math.min(red,imp),final:Math.max(0,imp-red)};
}
function salary(){
  const p=S.profile,b=+p.bruto||0,i=inssCalc(b),r=irrfCalc(b,i,+p.dep,+p.descontos);
  const liq=b-i-r.final-(+p.descontos||0);
  return{bruto:b,inss:i,irrf:r.final,irrfCheio:r.imp,desc:+p.descontos||0,fgts:b*.08,liq,extra:+p.renda||0,renda:liq+(+p.renda||0)};
}
const poupMes=()=>{const R=S.rates;return((R.selic>8.5?0.5:0.7*R.selic/12)+R.trMes)/100};

/* ===== investimentos ===== */
function invCalc(v,at){
  const R=S.rates,t=at||today(),days=dd(v.data,t),yrs=days/365,ap=+v.valor||0;
  const cdi=R.cdi/100,ipca=R.ipca12/100,selic=R.selic/100,tx=(+v.taxa||0)/100;
  let g=ap;
  switch(v.idx){
    case'cdi':g=ap*Math.pow(1+cdi*tx,yrs);break;
    case'pre':g=ap*Math.pow(1+tx,yrs);break;
    case'ipca':g=ap*Math.pow((1+ipca)*(1+tx),yrs);break;
    case'selic':g=ap*Math.pow(1+selic+tx,yrs);break;
    case'poup':g=ap*Math.pow(1+poupMes(),Math.floor(days/30));break;
    case'var':g=+v.atual>0?+v.atual:ap;break;
  }
  const gain=g-ap;
  const iof=(v.idx==='var'||v.idx==='poup'||v.isento)?0:(days<30&&gain>0?gain*IOF[Math.max(0,days-1)]/100:0);
  let ir=0;
  if(gain>0&&!v.isento&&v.idx!=='poup'){ir=v.idx==='var'?(gain*(+v.irPct||0)/100):(gain-iof)*irRate(days)}
  const fee=(v.idx!=='var'&&+v.custodia>0)?g*(+v.custodia/100)*yrs:0;
  const liq=g-iof-ir-fee,base=ap*Math.pow(1+ipca,yrs);
  const rent=(yrs>=.1&&ap>0&&liq>0)?Math.pow(liq/ap,1/yrs)-1:null;
  return{days,ap,bruto:g,gain,iof,ir,fee,liq,gl:liq-ap,real:liq-base,inflacao:base-ap,rent,
    nextStep:v.isento||v.idx==='poup'||v.idx==='var'?null:[180,360,720].map(x=>x-days).find(x=>x>0)??null,irTaxa:irRate(days)};
}
const invTotals=()=>{const a=S.invs.map(v=>({v,c:invCalc(v)}));return{rows:a,ap:sum(a,x=>x.c.ap),bruto:sum(a,x=>x.c.bruto),ir:sum(a,x=>x.c.ir),iof:sum(a,x=>x.c.iof),fee:sum(a,x=>x.c.fee),liq:sum(a,x=>x.c.liq),gl:sum(a,x=>x.c.gl),real:sum(a,x=>x.c.real),infl:sum(a,x=>x.c.inflacao)}};

/* ===== dívidas ===== */
function simDebt(d,extra=0){
  const i=(+d.taxaMes||0)/100;let s=+d.saldo||0;const n=Math.max(1,+d.parcelas||1),sys=d.sistema||'price';
  const fixed=sys==='sac'?0:(+d.parcela>0?+d.parcela:(i>0?s*i/(1-Math.pow(1+i,-n)):s/n));
  const am=s/n,s0=s;const rows=[];let tj=0,tp=0,m=0;
  if(sys!=='sac'&&fixed+extra<=s*i+1e-9)return{rows,tj:Infinity,tp:Infinity,meses:Infinity,ok:false,pmt:fixed,juro1:s*i};
  while(s>0.005&&m<600){m++;const j=s*i;const pay=sys==='sac'?Math.min(s+j,am+j+extra):Math.min(s+j,fixed+extra);s=s+j-pay;tj+=j;tp+=pay;rows.push({m,juros:j,amort:pay-j,pag:pay,saldo:Math.max(0,s)})}
  return{rows,tj,tp,meses:m,ok:s<=0.005,pmt:sys==='sac'?am+s0*i:fixed,juro1:s0*i};
}
const minPay=d=>simDebt(d).pmt||0;
function stratSim(debts,budget,mode){
  const ds=debts.map(d=>({s:+d.saldo,i:d.taxaMes/100,min:minPay(d)}));
  const mins=sum(ds,x=>x.min),B=Math.max(budget,mins);let m=0,jur=0;
  while(ds.some(x=>x.s>0.005)&&m<600){m++;let left=B;
    ds.forEach(x=>{if(x.s<=0.005)return;const j=x.s*x.i;jur+=j;x.s+=j;const p=Math.min(x.min,x.s);x.s-=p;left-=p});
    if(mode!=='min'){const o=ds.filter(x=>x.s>0.005).sort(mode==='avalanche'?(a,b)=>b.i-a.i:(a,b)=>a.s-b.s);for(const x of o){if(left<=0.005)break;const p=Math.min(left,x.s);x.s-=p;left-=p}}
  }
  return{meses:m,juros:jur,ok:m<600};
}
const debtTotals=()=>{const a=S.debts.map(d=>({d,c:simDebt(d)}));return{rows:a,saldo:sum(S.debts,d=>d.saldo),parcelas:sum(a,x=>x.c.pmt||0),juros1:sum(a,x=>x.c.juro1),jurosRest:sum(a,x=>isFinite(x.c.tj)?x.c.tj:0)}};

function monthSum(k){const t=txMonth(k);const r=sum(t.filter(x=>x.tipo==='receita'),x=>x.valor),d=sum(t.filter(x=>x.tipo==='despesa'),x=>x.valor);

const patrimonio=()=>{const it=invTotals();return{caixa:+S.profile.caixa||0,inv:it.liq,div:sum(S.debts,d=>d.saldo),pat:(+S.profile.caixa||0)+it.liq-sum(S.debts,d=>d.saldo)}};

function recs(){
  const out=[],R=S.rates,sal=salary(),IT=invTotals(),DT=debtTotals(),mm=monthSum(today().slice(0,7));
  const cdiLiqA=R.cdi/100*(1-.15),cdiLiqM=Math.pow(1+cdiLiqA,1/12)-1;
  S.debts.forEach(d=>{const a=Math.pow(1+d.taxaMes/100,12)-1;
    if(d.taxaMes/100>cdiLiqM*2){const dif=(d.taxaMes/100-cdiLiqM)*d.saldo*12;
      out.push({sev:'crit',t:`Quitar "${d.nome}" antes de investir`,p:`Esta dívida custa ${pc(d.taxaMes)} ao mês (${pc(a*100,1)} ao ano). Um CDB a 100% do CDI rende cerca de ${pc(cdiLiqM*100)} ao mês líquido. Cada real usado para quitar rende mais do que qualquer aplicação disponível.`,imp:dif,imps:'/ano a mais em juros'});}
    if(d.sistema==='rotativo'||d.taxaMes>=8){const alvo=1.9;const ec=(d.taxaMes-alvo)/100*d.saldo*12;
      if(ec>0)out.push({sev:'crit',t:`Trocar "${d.nome}" por crédito mais barato`,p:`Portabilidade, consignado ou empréstimo pessoal com juros menores que ${pc(alvo,1)} ao mês substituem esta dívida. Compare o CET antes de contratar.`,imp:ec,imps:'/ano de economia possível'});}
  });
  const renda=sal.renda||mm.r;
  if(renda>0){const cp=DT.parcelas/renda;
    if(cp>.4)out.push({sev:'crit',t:'Parcelas comprometem mais de 40% da renda',p:`As parcelas somam ${brl(DT.parcelas)} por mês (${pc(cp*100,0)} da renda líquida). Acima de 30% o orçamento perde folga para imprevistos.`,imp:DT.parcelas-.3*renda,imps:'/mês acima do limite de 30%'});
    else if(cp>.3)out.push({sev:'warn',t:'Parcelas acima de 30% da renda',p:`Comprometimento atual: ${pc(cp*100,0)} (${brl(DT.parcelas)}). Renegocie ou antecipe a dívida mais cara.`,imp:DT.parcelas-.3*renda,imps:'/mês acima do ideal'});
    else if(DT.parcelas>0)out.push({sev:'ok',t:'Parcelas dentro do limite saudável',p:`Dívidas consomem ${pc(cp*100,0)} da renda líquida, abaixo de 30%.`});
    const tp=renda>0?(mm.r>0?(mm.r-mm.d)/mm.r:0):0;
    if(mm.r>0){if(tp<.1)out.push({sev:'crit',t:'Taxa de poupança abaixo de 10%',p:`Neste mês sobra ${pc(tp*100,1)} da receita. A meta mínima é 20%, ou ${brl(mm.r*.2)} por mês.`,imp:mm.r*.2-(mm.r-mm.d),imps:'/mês para chegar a 20%'});
      else if(tp<.2)out.push({sev:'warn',t:'Taxa de poupança abaixo de 20%',p:`Você guarda ${pc(tp*100,1)} da receita. Faltam ${brl(mm.r*.2-(mm.r-mm.d))} por mês para a meta de 20%.`,imp:mm.r*.2-(mm.r-mm.d),imps:'/mês'});
      else out.push({sev:'ok',t:'Taxa de poupança na meta',p:`Você guarda ${pc(tp*100,1)} da receita neste mês.`});}
    const disc=mm.byCls.D;if(mm.r>0&&disc>.3*mm.r)out.push({sev:'warn',t:'Desejos acima de 30% da receita',p:`Restaurantes, lazer, assinaturas e compras somam ${brl(disc)} (${pc(disc/mm.r*100,0)}). O alvo é até ${brl(.3*mm.r)}.`,imp:disc-.3*mm.r,imps:'/mês de excesso'});
  }
  /* reserva */
  const ms=[0,1,2].map(i=>monthSum(mon(today().slice(0,7),-i))).filter(x=>x.d>0);
  const avg=ms.length?sum(ms,x=>x.d)/ms.length:0,meta=avg*(+S.profile.reserva||6);
  const liquida=sum(IT.rows.filter(x=>x.v.liq==='D+0'||x.v.liq==='D+1'),x=>x.c.liq)+(+S.profile.caixa||0);
  if(meta>0){if(liquida<meta)out.push({sev:'warn',t:'Reserva de emergência incompleta',p:`Meta de ${S.profile.reserva} meses de despesas: ${brl(meta)}. Disponível com liquidez imediata: ${brl(liquida)}.`,imp:meta-liquida,imps:'faltam'});
    else out.push({sev:'ok',t:'Reserva de emergência completa',p:`Você tem ${nn(liquida/avg,1)} meses de despesas em ativos líquidos.`});}
  /* poupança */
  IT.rows.filter(x=>x.v.idx==='poup').forEach(x=>{const pa=Math.pow(1+poupMes(),12)-1,ex=(cdiLiqA-pa)*x.c.liq;
    if(ex>0)out.push({sev:'warn',t:'Poupança rende menos que um CDB simples',p:`A poupança rende ${pc(pa*100)} ao ano. Um CDB de liquidez diária a 100% do CDI rende ${pc(cdiLiqA*100)} ao ano líquido de IR (alíquota de 15% após 2 anos).`,imp:ex,imps:'/ano deixados na mesa'});});
  IT.rows.forEach(x=>{if(x.c.days>60&&x.c.real<-1&&x.v.idx!=='var')out.push({sev:'warn',t:`"${x.v.nome}" rende abaixo da inflação`,p:`Rendimento líquido anual de ${x.c.rent!=null?pc(x.c.rent*100):'—'} contra IPCA de ${pc(R.ipca12)}.`,imp:x.c.real,imps:' de perda real'});
    if(x.c.nextStep!=null&&x.c.nextStep<=45&&x.c.gain>0)out.push({sev:'info',t:`Aguarde ${x.c.nextStep} dias para resgatar "${x.v.nome}"`,p:`A alíquota de IR cai de ${pc(x.c.irTaxa*100,1)} para ${pc(irRate(x.c.days+x.c.nextStep)*100,1)} em ${fdate(addM(today(),0).slice(0,0)||ymd(new Date(Date.now()+x.c.nextStep*864e5)))}.`,imp:x.c.gain*(x.c.irTaxa-irRate(x.c.days+x.c.nextStep)),imps:'de IR a menos'})});
  if(IT.liq>0){const top=[...IT.rows].sort((a,b)=>b.c.liq-a.c.liq)[0];if(top&&top.c.liq/IT.liq>.5&&IT.rows.length>1)out.push({sev:'info',t:'Carteira concentrada',p:`"${top.v.nome}" representa ${pc(top.c.liq/IT.liq*100,0)} dos investimentos. Distribua entre emissores, prazos e indexadores.`})}
  const old=dd(R.updatedAt||today(),today());if(old>30)out.push({sev:'warn',t:'Taxas desatualizadas',p:`As taxas foram atualizadas há ${old} dias. Revise a aba Taxas para manter os cálculos precisos.`});
  if(!out.length)out.push({sev:'ok',t:'Nada crítico por aqui',p:'Cadastre lançamentos, dívidas e investimentos para receber análises personalizadas.'});
  const rank={crit:0,warn:1,info:2,ok:3};return out.sort((a,b)=>rank[a.sev]-rank[b.sev]);
}

const PAL=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
function nice(max){if(max<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(max))),f=max/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
const short=n=>{const a=Math.abs(n),s=n<0?'-':'';return s+(a>=1e6?(a/1e6).toFixed(1).replace('.',',')+' mi':a>=1e3?(a/1e3).toFixed(a>=1e4?0:1).replace('.',',')+' mil':nn(a))}
function lineChart(labels,series,o={}){
  const W=640,H=o.h||250,L=52,R=16,T=14,B=26;const all=series.flatMap(s=>s.v.filter(Number.isFinite));if(!all.length)return'<div class="empty">Sem dados para o gráfico</div>';
  let mn=Math.min(...all,o.zero?0:Infinity),mx=Math.max(...all);if(mn===mx){mx=mn+1}
  const step=nice((mx-mn)/4),lo=Math.floor(mn/step)*step,hi=Math.ceil(mx/step)*step;
  const x=i=>L+(labels.length<2?(W-L-R)/2:i*(W-L-R)/(labels.length-1)),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g='',tk=[];for(let v=lo;v<=hi+1e-9;v+=step)tk.push(v);
  tk.forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text class="tick" x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${short(v)}</text>`);
  const every=Math.ceil(labels.length/8);labels.forEach((l,i)=>{if(i%every===0||i===labels.length-1)g+=`<text class="tick" x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`});
  series.forEach((s,k)=>{const col=s.color||PAL[k%6];const pts=s.v.map((v,i)=>Number.isFinite(v)?[x(i),y(v)]:null).filter(Boolean);if(!pts.length)return;
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
    if(s.area&&pts.length>1)g+=`<path d="${d}L${pts[pts.length-1][0]} ${y(lo)}L${pts[0][0]} ${y(lo)}Z" fill="${col}" opacity=".14"/>`;
    g+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${s.w||2.2}" stroke-linejoin="round" stroke-linecap="round"${s.dash?` stroke-dasharray="${s.dash}"`:''}/>`;
    const e=pts[pts.length-1];g+=`<circle cx="${e[0]}" cy="${e[1]}" r="3.6" fill="${col}"><title>${esc(s.name)}: ${brl(s.v[s.v.length-1])}</title></circle>`;
    if(o.endLabel&&k<(o.endLabel===true?1:o.endLabel))g+=`<text class="lab" x="${Math.min(e[0],W-R)}" y="${e[1]-9}" text-anchor="end">${short(s.v[s.v.length-1])}</text>`;
    if(pts.length<=24)s.v.forEach((v,i)=>{if(Number.isFinite(v))g+=`<circle cx="${x(i)}" cy="${y(v)}" r="9" fill="transparent"><title>${esc(s.name)} · ${esc(labels[i])}: ${brl(v)}</title></circle>`})});
  return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Gráfico de linhas')}">${g}</svg>${legend(series)}</div>`;
}
function legend(items){return items.length>1?`<div class="legend">${items.map((s,k)=>`<span><i style="background:${s.color||PAL[k%6]}"></i>${esc(s.name)}</span>`).join('')}</div>`:''}
function barChart(labels,series,o={}){
  const W=640,H=o.h||240,L=52,R=12,T=14,B=26;const mx=nice(Math.max(1,...series.flatMap(s=>s.v)));const y=v=>T+(H-T-B)*(1-v/mx);
  const gw=(W-L-R)/labels.length,bw=Math.min(34,gw*.7/series.length);let g='';
  for(let i=0;i<=4;i++){const v=mx*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text class="tick" x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${short(v)}</text>`}
  labels.forEach((l,i)=>{const cx=L+gw*i+gw/2;g+=`<text class="tick" x="${cx}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`;
    series.forEach((s,k)=>{const v=s.v[i]||0,bx=cx-bw*series.length/2+k*bw;g+=`<rect x="${bx+1}" y="${y(v)}" width="${bw-2}" height="${Math.max(0,y(0)-y(v))}" rx="3" fill="${s.color||PAL[k%6]}"><title>${esc(s.name)} · ${esc(l)}: ${brl(v)}</title></rect>`})});
  return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Gráfico de barras')}">${g}</svg>${legend(series)}</div>`;
}
function donut(items,o={}){
  const tot=sum(items,x=>x.v);if(tot<=0)return'<div class="empty">Sem dados para o gráfico</div>';const r=70,c=2*Math.PI*r;let off=0,g='';
  items.forEach((it,k)=>{const f=it.v/tot,col=PAL[k%6];g+=`<circle cx="100" cy="100" r="${r}" fill="none" stroke="${col}" stroke-width="30" stroke-dasharray="${(f*c).toFixed(2)} ${(c-f*c).toFixed(2)}" stroke-dashoffset="${(-off*c).toFixed(2)}" transform="rotate(-90 100 100)"><title>${esc(it.l)}: ${brl(it.v)} (${pc(f*100,1)})</title></circle>`;off+=f});
  return`<div class="chart donutwrap"><svg viewBox="0 0 200 200" role="img" aria-label="${esc(o.label||'Composição')}">${g}<text x="100" y="97" text-anchor="middle" class="tick">${esc(o.center||'Total')}</text><text x="100" y="116" text-anchor="middle" class="lab" style="font-size:14px">${short(tot)}</text></svg>
  <div style="display:flex;flex-direction:column;gap:6px;min-width:0">${items.map((it,k)=>`<div style="display:flex;gap:8px;align-items:center;font-size:.8rem;min-width:0"><i style="width:10px;height:10px;border-radius:3px;flex:none;background:${PAL[k%6]}"></i><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.l)}</span><span class="num muted">${pc(it.v/tot*100,0)}</span></div>`).join('')}</div></div>`;
}

/* ===== SIMULADOR ===== */
function simProds(){const s=ui.sim,R=S.rates,d=s.delta||0;const cdi=(R.cdi+d)/100,selic=(R.selic+d)/100,ipca=R.ipca12/100;
  const m=a=>Math.pow(1+a,1/12)-1;
  return[
    {id:'poup',n:'Poupança',rm:(((R.selic+d)>8.5?0.5:0.7*(R.selic+d)/12)+R.trMes)/100,isento:1,fee:0,desc:'0,5% + TR ao mês'},
    {id:'selic',n:'Tesouro Selic',rm:m(selic-0.002),isento:0,fee:0,desc:'Selic, custódia 0,20% a.a.'},
    {id:'cdb100',n:'CDB 100% do CDI',rm:m(cdi),isento:0,fee:0,desc:'liquidez diária'},
    {id:'cdbx',n:`CDB ${nn(s.cdbPct)}% do CDI`,rm:m(cdi*s.cdbPct/100),isento:0,fee:0,desc:'taxa editável'},
    {id:'lci',n:`LCI/LCA ${nn(s.lciPct)}% do CDI`,rm:m(cdi*s.lciPct/100),isento:1,fee:0,desc:'isento de IR'},
    {id:'ipca',n:`Tesouro IPCA+ ${nn(s.ipcaSp,1)}%`,rm:m((1+ipca)*(1+s.ipcaSp/100)-1-0.002),isento:0,fee:0,desc:'IPCA + taxa, custódia 0,20%'},
    {id:'pre',n:`Prefixado ${nn(s.preTx,1)}% a.a.`,rm:m(s.preTx/100),isento:0,fee:0,desc:'taxa fixa'}];}
function simNet(p,ini,ap,M){ // série do valor líquido por mês
  const out=[ini];
  for(let t=1;t<=M;t++){let v=0;
    for(let k=0;k<=t;k++){const amt=k===0?ini:ap;if(!amt)continue;const age=t-k,g=amt*Math.pow(1+p.rm,age),gain=g-amt;v+=g-(p.isento||gain<=0?0:gain*irRate(age*30.4))}
    out.push(v)}return out}
function simFinal(p,ini,ap,M){let v=0;for(let k=0;k<=M;k++){const amt=k===0?ini:ap;if(!amt)continue;const age=M-k,g=amt*Math.pow(1+p.rm,age),gain=g-amt;v+=g-(p.isento||gain<=0?0:gain*irRate(age*30.4))}return v}
function irr(final,ini,ap,M){let lo=-.05,hi=.1;for(let i=0;i<60;i++){const r=(lo+hi)/2;const fv=ini*Math.pow(1+r,M)+(Math.abs(r)<1e-9?ap*M:ap*(Math.pow(1+r,M)-1)/r);fv>final?hi=r:lo=r}return Math.pow(1+(lo+hi)/2,12)-1}
function simOut(){
  const s=ui.sim,M=clamp(Math.round(s.meses)||1,1,480),ini=+s.ini||0,ap=+s.aporte||0,prods=simProds(),tot=ini+ap*M,ipca=S.rates.ipca12/100;
  const rs=prods.map(p=>{const f=simFinal(p,ini,ap,M);return{p,f,gain:f-tot,real:f/Math.pow(1+ipca,M/12),rent:tot>0?irr(f,ini,ap,M):0,gross:0}}).sort((a,b)=>b.f-a.f);
  const best=rs[0];
  const labels=[];const step=Math.max(1,Math.ceil(M/12));const idxs=[];for(let t=0;t<=M;t+=step){idxs.push(t);labels.push(t===0?'0':t%12===0?(t/12)+'a':t+'m')}if(idxs[idxs.length-1]!==M){idxs.push(M);labels.push(M%12===0?(M/12)+'a':M+'m')}
  const series=rs.slice(0,5).map((r,k)=>{const sr=simNet(r.p,ini,ap,M);return{name:r.p.n,v:idxs.map(i=>sr[i]),color:PAL[k%6],w:k===0?3:2}});
  series.push({name:'Total aportado',v:idxs.map(i=>ini+ap*i),color:'var(--muted)',dash:'5 4',w:1.6});
  // meta
  let metaTxt='';const meta=+s.meta||0;if(meta>0){const sr=simNet(best.p,ini,ap,Math.min(600,Math.max(M,600)));const t=sr.findIndex(v=>v>=meta);
    const unit=simFinal(best.p,0,1,M),base=simFinal(best.p,ini,0,M),need=(meta-base)/unit;

async function importText(txt,pass){
  const err=$('#bk_err');const e=m=>{if(err)err.textContent=m};
  try{const o=JSON.parse(txt);let st=o;
    if(o.kind==='cofre-enc'){let key=KEY;try{st=await unseal(o.blob,key)}catch(_){if(!pass){e('Não abriu com a senha atual. Informe a senha usada ao exportar.');return askPass(txt)}key=await dataKey(pass,o.salt);st=await unseal(o.blob,key)}}
    if(!st||!Array.isArray(st.tx)||!st.profile)throw new Error('formato');
    await autoBackup(null,true,'antes da importação');S=normalize(st);logEv('Importou backup');save();toast('Dados restaurados');render();
  }catch(x){e('Arquivo inválido ou senha incorreta.')}
}

const pwScore=p=>{let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;return s};

/* ===== normalização ===== */
function normalize(st){
  st.rates={...defRates(),...(st.rates||{})};
  st.profile={nome:'Cleilton',bruto:0,dep:0,descontos:0,renda:0,caixa:0,reserva:6,lockMin:10,...(st.profile||{})};
  ['tx','debts','invs','goals','history','log'].forEach(k=>{if(!Array.isArray(st[k]))st[k]=[]});
  st.backup={auto:true,every:30,keep:15,last:0,...(st.backup||{})};return st;
}
ui.rep='mensal';ui.dx={extra:300,budget:0,pick:null};
ui.sim={ini:10000,aporte:800,meses:60,meta:100000,cdbPct:110,lciPct:92,ipcaSp:7,preTx:13.5,delta:0};

/* ===== login ===== */
const loginHTML=()=>`<div class="login"><section class="login-brand"><div class="brandmark"><i>C</i>Cofre Financeiro</div>
<svg class="vault" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="92" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="100" cy="100" r="72" fill="var(--surface)" stroke="var(--accent-fg)" stroke-width="3"/><g stroke="var(--accent-fg)" stroke-width="3" stroke-linecap="round">${Array.from({length:12},(_,i)=>{const a=i*Math.PI/6;return`<line x1="${100+78*Math.cos(a)}" y1="${100+78*Math.sin(a)}" x2="${100+90*Math.cos(a)}" y2="${100+90*Math.sin(a)}"/>`}).join('')}</g><circle cx="100" cy="100" r="30" fill="var(--bg)" stroke="var(--accent-fg)" stroke-width="3"/><path d="M100 100L100 78M100 100L118 110M100 100L82 110" stroke="var(--accent-fg)" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="100" r="5" fill="var(--accent-fg)"/></svg>
<div><h1>Seu dinheiro, <em>sob controle</em>.</h1><p class="muted" style="margin-top:12px;max-width:42ch">Dívidas, investimentos e salário calculados com as taxas vigentes no Brasil.</p></div></section>
<section class="login-card"><form id="lform" autocomplete="on" novalidate><div><h2>Acesso restrito</h2><p class="muted">Entre com suas credenciais.</p></div>
<label class="field"><span>Usuário</span><input type="text" id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
<label class="field"><span>Senha</span><div class="pw"><input type="password" id="lp" autocomplete="current-password" required><button type="button" class="btn sm ghost" id="lshow" aria-label="Mostrar ou ocultar a senha">Mostrar</button></div></label>
<div class="err" id="lerr" role="alert"></div><button class="btn primary" id="lbtn" type="submit" style="padding:12px">Entrar</button>
<div class="lock-banner"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>Criptografia AES-256 · bloqueio após 5 tentativas</div>
</form></section><div class="login-theme">${themeBtn()}</div></div>`;
function bindLogin(){
  const f=$('#lform'),err=$('#lerr'),btn=$('#lbtn');let tm=null;
  const lockInfo=()=>{const lk=JSON.parse(LS.get('cf_lock')||'{}'),w=Math.ceil(((lk.until||0)-Date.now())/1000);clearInterval(tm);if(w>0){btn.disabled=true;err.textContent='Muitas tentativas. Aguarde '+w+'s para tentar de novo.';tm=setInterval(()=>{const r=Math.ceil(((lk.until||0)-Date.now())/1000);if(r<=0){clearInterval(tm);btn.disabled=false;err.textContent=''}else err.textContent='Muitas tentativas. Aguarde '+r+'s para tentar de novo.'},500);return true}btn.disabled=false;return false};
  lockInfo();$('#lu').focus();
  $('#lshow').onclick=()=>{const p=$('#lp'),s=p.type==='password';p.type=s?'text':'password';$('#lshow').textContent=s?'Ocultar':'Mostrar'};
  f.onsubmit=async e=>{e.preventDefault();if(lockInfo())return;err.textContent='';btn.disabled=true;btn.textContent='Verificando…';
    try{await tryLogin($('#lu').value,$('#lp').value)}catch(x){console.error(x);err.textContent='Não foi possível validar o acesso neste navegador.'}
    btn.textContent='Entrar';if(ui.locked){btn.disabled=false;lockInfo()}};
}
function accLog(ok){const a=JSON.parse(LS.get('cf_acc')||'[]');a.unshift({t:Date.now(),ok});LS.set('cf_acc',JSON.stringify(a.slice(0,30)))}
async function tryLogin(u,p){
  const err=$('#lerr');if(!window.crypto||!crypto.subtle){err.textContent='Este navegador não oferece criptografia segura.';return}
  if(!u.trim()||!p){err.textContent='Informe usuário e senha.';return}
  const cred=getCred(),v=await verifier(u,p,cred.salt);
  if(v!==cred.ver){const lk=JSON.parse(LS.get('cf_lock')||'{}'),n=(lk.n||0)+1;LS.set('cf_lock',JSON.stringify({n,until:n>=5?Date.now()+Math.min(900,30*Math.pow(2,n-5))*1000:0}));accLog(false);err.textContent=n>=5?'Acesso bloqueado temporariamente.':'Usuário ou senha incorretos. Restam '+(5-n)+' tentativas.';$('#lp').value='';return}
  LS.del('cf_lock');accLog(true);KEY=await dataKey(p,cred.salt);
  const blob=LS.get('cf_data');
  if(blob){try{S=normalize(await unseal(blob,KEY))}catch(e){KEY=null;err.textContent='Não foi possível abrir os dados salvos com esta senha.';return}}
  else{S=normalize(seed());ui.sim.ini=10000}
  logEv('Acesso liberado');ui.locked=false;ui.view='dash';ui.month=today().slice(0,7);lastAct=Date.now();await persist();render();
}
let lastAct=Date.now();
['mousemove','keydown','click','touchstart','scroll'].forEach(ev=>addEventListener(ev,()=>lastAct=Date.now(),{passive:true}));
setInterval(()=>{if(S&&!ui.locked&&Date.now()-lastAct>(S.profile.lockMin||10)*60000)lock()},10000);
async function lock(){clearTimeout(saveT);try{await persist()}catch(e){}KEY=null;S=null;ui.locked=true;closeModal();render()}
addEventListener('visibilitychange',()=>{if(document.hidden&&S&&KEY)persist()});

/* ===== casca do app ===== */
function toggleTheme(){const r=document.documentElement;const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');const nx=cur==='dark'?'light':'dark';r.dataset.theme=nx;LS.set('cf_theme',nx);render()}
const VMAP={dash:vDash,tx:vTx,debt:vDebt,inv:vInv,sim:vSim,sal:vSal,rep:vRep,tax:vTax,bk:vBk,sec:vSec};
function render(){
  const app=$('#app');
  $('#totop').classList.remove('show');
  if(ui.locked||!S){app.innerHTML=loginHTML();bindLogin();return}
  const sy=window.scrollY;const rf=ui.refocus;
  const nav=VIEWS.map(([k,l])=>`<button data-act="nav" data-v="${k}"${ui.view===k?' aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICO[k]}</svg>${l}</button>`).join('');
    app.innerHTML=`<div class="shell"><div class="menu-scrim${ui.menu?' show':''}" data-act="menu"></div><aside class="side${ui.menu?' open':''}" id="side" aria-label="Menu principal"><div class="brandmark"><i>C</i>Cofre Financeiro</div><nav class="nav" aria-label="Seções">${nav}</nav><div class="side-foot"><button class="btn sm" data-act="lock">Bloquear</button></div></aside>
  <header class="topbar"><button class="iconbtn" data-act="menu" aria-label="Abrir menu" aria-expanded="${ui.menu}" aria-controls="side"><svg class="hamb" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg></button><span class="brandmark"><i>C</i>Cofre Financeiro</span>${themeBtn()}</header>
  <main class="main" id="main">${VMAP[ui.view]()}</main></div>`;
  labelTables(app);
  window.scrollTo(0,sy);
  if(rf){const el=document.getElementById(rf.id);if(el){el.focus();try{el.setSelectionRange(rf.pos,rf.pos)}catch(e){}}ui.refocus=null}
}
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||'Copiado')}catch(e){const b=$('#repbox');if(b){const r=document.createRange();r.selectNodeContents(b);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Selecione e copie manualmente (Ctrl+C)')}}

/* ===== eventos ===== */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,k=b.dataset.k,id=b.dataset.id;
  if(a==='theme')return toggleTheme();
  if(a==='nav'){ui.view=b.dataset.v;ui.menu=false;return render()}
  if(a==='menu')return setMenu(!ui.menu);
  if(a==='top')return scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  if(!S)return;
  switch(a){
    case'add':crud(k);break;case'edit':crud(k,id);break;case'del':del(k,id);break;
    case'sched':schedModal(id);break;
    case'lock':lock();break;
    case'profile':openForm('Dados do salário',[{k:'nome',l:'Nome'},{k:'bruto',l:'Salário bruto (R$)',t:'number'},{k:'dep',l:'Dependentes',t:'number'},{k:'descontos',l:'Outros descontos em folha (R$)',t:'number',h:'Plano de saúde, vale-transporte, pensão'},{k:'renda',l:'Renda extra mensal líquida (R$)',t:'number'},{k:'caixa',l:'Saldo em conta (R$)',t:'number'},{k:'reserva',l:'Meta de reserva (meses de despesa)',t:'number'}],S.profile,o=>{Object.assign(S.profile,o)});break;
    case'clear-ex':confirmBox('Remover todos os itens marcados como exemplo?',()=>{['tx','debts','invs','goals','history'].forEach(c=>S[c]=S[c].filter(x=>!x.ex));if(!S.history.length)snap();save();render();toast('Exemplos removidos')},'Remover');break;
    case'rep':ui.rep=k;render();break;
    case'rep-copy':copyText(buildReport(ui.rep).txt,'Relatório copiado');break;
    case'rep-txt':saveFile(`relatorio-${ui.rep}-${today()}.txt`,buildReport(ui.rep).txt);break;
    case'rep-csv':saveFile(`relatorio-${ui.rep}-${today()}.csv`,'﻿'+buildReport(ui.rep).csv);break;
    case'rates-reset':S.rates=defRates();save();render();toast('Taxas restauradas');break;
    case'bk-now':await autoBackup(null,true);toast('Backup criado');render();break;
    case'bk-restore':confirmBox('Restaurar esta cópia? Os dados atuais serão salvos em um backup antes.',()=>restoreBk(id),'Restaurar');break;
    case'bk-del':LS.set('cf_bk',JSON.stringify(getBk().filter(x=>x.id!==id)));render();break;
    case'bk-export-enc':saveFile(`cofre-backup-${today()}.json`,JSON.stringify({kind:'cofre-enc',v:1,salt:getCred().salt,exportedAt:new Date().toISOString(),blob:await seal(S,KEY)}));break;
    case'bk-export-plain':saveFile(`cofre-dados-${today()}.json`,JSON.stringify(S,null,1));break;
    case'bk-import':{const t=$('#bk_paste').value.trim();if(!t){$('#bk_err').textContent='Cole o conteúdo do arquivo ou escolha um arquivo.';break}importText(t);break}
    case'wipe':confirmBox('Apagar todos os dados, backups e a senha personalizada deste navegador? Não há como desfazer.',async()=>{['cf_data','cf_bk','cf_cred','cf_lock','cf_acc'].forEach(LS.del);KEY=null;S=null;ui.locked=true;toast('Dados apagados');render()},'Apagar tudo');break;
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;if(!S)return;
  if(t.id==='mpick'&&t.value){ui.month=t.value;render()}
  else if(t.dataset.rate){const k=t.dataset.rate;S.rates[k]=k==='updatedAt'?t.value:(+t.value||0);save();render()}
  else if(t.id==='bk_auto'){S.backup.auto=t.checked;save();render()}
  else if(t.id==='bk_every'){S.backup.every=Math.max(1,+t.value||30);save()}
  else if(t.id==='bk_keep'){S.backup.keep=clamp(+t.value||15,3,40);save()}
  else if(t.id==='lockmin'){S.profile.lockMin=clamp(+t.value||10,1,120);save();toast('Bloqueio automático atualizado')}
  else if(t.id==='bk_file'&&t.files[0]){importText(await t.files[0].text())}
});
document.addEventListener('input',e=>{
  const t=e.target;if(!S)return;
  if(t.id&&t.id.startsWith('s_')){const k=t.id.slice(2);ui.sim[k]=+t.value;if(k==='delta'){$('#deltaV').textContent=(ui.sim.delta>0?'+':'')+nn(ui.sim.delta,2)+' p.p.'}clearTimeout(input.t);input.t=setTimeout(()=>{$('#simout').innerHTML=simOut().html;if(k==='delta'){const sm=t.parentElement.querySelector('small');if(sm)sm.textContent='Selic e CDI mudam juntos: '+pc(S.rates.selic+ui.sim.delta)}},120)}
  else if(t.id==='dxpick'||t.id==='dxextra'||t.id==='dxbud'){if(t.id==='dxpick')ui.dx.pick=t.value;else if(t.id==='dxextra')ui.dx.extra=+t.value;else ui.dx.budget=+t.value;ui.refocus={id:t.id,pos:t.selectionStart};clearTimeout(input.t);input.t=setTimeout(render,250)}
  else if(t.id==='pw1'){const s=pwScore(t.value);$('#pwbar').style.width=s*20+'%';$('#pwbar').className=s>=4?'ok':s>=3?'wr':'';$('#pwtxt').textContent=['Muito fraca','Muito fraca','Fraca','Razoável','Forte','Muito forte'][s]}
});
const input={};
document.addEventListener('submit',async e=>{
  if(e.target.id!=='pwform'||!S)return;e.preventDefault();
  const p0=$('#pw0').value,p1=$('#pw1').value,p2=$('#pw2').value,er=$('#pwerr');er.textContent='';
  const cred=getCred();
  if(await verifier('cleilton',p0,cred.salt)!==cred.ver)return er.textContent='A senha atual está incorreta.';
  if(p1.length<8||pwScore(p1)<3)return er.textContent='Use ao menos 8 caracteres com letras, números e símbolo.';
  if(p1!==p2)return er.textContent='As senhas novas não conferem.';
  const salt=toB64(crypto.getRandomValues(new Uint8Array(16))),nk=await dataKey(p1,salt),ver=await verifier('cleilton',p1,salt);
  const nb=[];for(const b of getBk()){try{nb.push({...b,blob:await seal(await unseal(b.blob,KEY),nk)})}catch(_){}}
  LS.set('cf_bk',JSON.stringify(nb));LS.set('cf_cred',JSON.stringify({salt,ver}));KEY=nk;logEv('Senha alterada');await persist();toast('Senha alterada');render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal-root').innerHTML)closeModal();else if(ui.menu)setMenu(false)}});
addEventListener('scroll',()=>{$('#totop').classList.toggle('show',scrollY>320&&!ui.locked)},{passive:true});

/* ===== início ===== */
try{const th=LS.get('cf_theme');if(th==='dark'||th==='light')document.documentElement.dataset.theme=th}catch(e){}
render();
</script>
